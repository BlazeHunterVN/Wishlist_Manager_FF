<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Sắp Ra Mắt</title>
    <style>
        :root {
            --bg: #0b1220;
            --fg: #f2f5ff;
            --accent: #5c6cff;
            --muted: #a8b2cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at top, #16213d, #050814);
            color: var(--fg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            max-width: 540px;
            width: 100%;
            padding: 2.5rem;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 18px;
            backdrop-filter: blur(18px);
            background: rgba(0, 0, 0, .35);
        }

        h1 {
            font-size: 2.25rem;
            letter-spacing: .02em;
            margin-bottom: .5rem;
        }

        p {
            color: var(--muted);
            line-height: 1.5;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
        }

        .countdown>div {
            min-width: 70px;
            padding: 1rem 0;
            border-radius: 12px;
            background: rgba(255, 255, 255, .08);
        }

        .countdown span {
            display: block;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .countdown small {
            display: block;
            margin-top: .25rem;
            color: rgba(255, 255, 255, .7);
            font-size: .85rem;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: .85rem;
            color: rgba(255, 255, 255, .6);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Chúng tôi sắp ra mắt!</h1>
        <p>Trang web đang được hoàn thiện. Hãy ghi lại thông tin bên dưới để nhận cập nhật ngay khi chúng tôi đi vào
            hoạt động.</p>
        <div class="countdown" aria-label="Đếm ngược đến thời điểm ra mắt">
            <div><span id="days">00</span><small>Ngày</small></div>
            <div><span id="hours">00</span><small>Giờ</small></div>
            <div><span id="minutes">00</span><small>Phút</small></div>
            <div><span id="seconds">00</span><small>Giây</small></div>
        </div>
        <p class="footer">Bạn cũng có thể liên hệ qua <a href="mailto:contact@example.com">contact@example.com</a> để
            biết thêm thông tin.</p>
    </div>
    <script>
        const target = new Date();
        target.setDate(target.getDate() + 7);

        const fmt = n => String(n).padStart(2, '0');
        const update = () => {
            const now = new Date();
            const diff = Math.max(0, target - now);
            const secs = Math.floor(diff / 1000);
            const days = Math.floor(secs / 86400);
            const hours = Math.floor(secs % 86400 / 3600);
            const mins = Math.floor(secs % 3600 / 60);
            const secsRem = secs % 60;
            document.getElementById('days').textContent = fmt(days);
            document.getElementById('hours').textContent = fmt(hours);
            document.getElementById('minutes').textContent = fmt(mins);
            document.getElementById('seconds').textContent = fmt(secsRem);
        };
        update();
        setInterval(update, 1000);
    </script>
</body>

</html>
